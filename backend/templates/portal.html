<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ settings.welcome_message }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body>

<div class="portal-card">
    <div class="text-center mb-4">
        <h2 style="color: var(--uj-grey); font-weight: 800;">UJ <span style="color: var(--uj-orange);">WiFi</span></h2>
    </div>

    <h4 class="text-center mb-4" style="color: var(--uj-grey);">{{ settings.welcome_message }}</h4>

    <form action="/authenticate" method="POST">
        <div class="mb-3">
            <label class="form-label">Student / Staff Number</label>
            <input type="text" name="username" class="form-control" placeholder="e.g. 210000000" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="UJ uLink Password" required>
        </div>
        <button type="submit" class="btn btn-uj w-100 py-2">Sign In</button>
    </form>

    <div class="terms-text">
        {{ settings.terms_of_use }}
    </div>
</div>

</body>
</html>
