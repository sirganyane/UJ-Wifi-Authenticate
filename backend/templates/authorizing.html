<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJ WiFi | Authorizing...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { 
            --uj-orange: #FF8C00; 
            --uj-blue: #00467F;
            --uj-grey: #4A4A4A;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .portal-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            border-top: 8px solid var(--uj-orange);
        }

        .progress-container {
            height: 12px;
            background-color: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--uj-orange);
            width: 0%;
            transition: width 5s linear; /* Matches the 5 second timeout */
            border-radius: 6px;
        }

        .spinner-uj {
            color: var(--uj-blue) !important;
        }
    </style>
</head>
<body onload="startAuth()">

<div class="portal-card text-center">
    <div class="spinner-border spinner-uj mb-4" role="status" style="width: 3.5rem; height: 3.5rem; border-width: 0.25em;">
        <span class="visually-hidden">Loading...</span>
    </div>

    <h3 style="color: var(--uj-grey); font-weight: bold;">Authorizing Device...</h3>
    <p class="text-muted">Registering your MAC address with the UJ Gateway for secure access.</p>
    
    <div class="progress-container">
        <div id="progress" class="progress-bar-fill"></div>
    </div>
    
    <div class="mt-3">
        <small class="text-secondary">Please do not refresh or close this window.</small>
    </div>
    
    <div class="mt-4 pt-3 border-top">
        <img src="https://www.uj.ac.za/wp-content/uploads/2021/11/uj-logo.png" alt="UJ Logo" style="width: 80px; opacity: 0.6;">
    </div>
</div>

<script>
    function startAuth() {
        const progress = document.getElementById('progress');
        
        // Force a slight delay to ensure the transition triggers after page load
        setTimeout(() => {
            progress.style.width = '100%';
        }, 100);
        
        // Wait 5.5 seconds (simulating network delay) then redirect to success.html
        setTimeout(function() {
            // Logs to console for debugging in your Command Center (index.html)
            console.log("MAC_REGISTERED: Gateway authorization successful.");
            window.location.href = "success.html";
        }, 5500);
    }
</script>

</body>
</html>
