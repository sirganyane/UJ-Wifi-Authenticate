<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UJ WiFi | Authorizing...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
    <style>
        .progress-bar-fill {
            height: 10px;
            background-color: var(--uj-orange);
            width: 0%;
            transition: width 5s linear;
            border-radius: 5px;
        }
    </style>
</head>
<body onload="startAuth()">

<div class="portal-card text-center">
    <div class="spinner-border text-warning mb-4" role="status" style="width: 3rem; height: 3rem;"></div>
    <h3 style="color: var(--uj-grey);">Authorizing Device...</h3>
    <p class="text-muted">Registering your MAC address with the UJ Gateway.</p>
    
    <div class="bg-light w-100 rounded mb-3">
        <div id="progress" class="progress-bar-fill"></div>
    </div>
    
    <small class="text-muted">Please do not close this window.</small>
</div>

<script>
    function startAuth() {
        // Start progress bar
        document.getElementById('progress').style.width = '100%';
        
        // Wait 5 seconds (simulating network delay) then redirect to UJ uLink
        setTimeout(function() {
            window.location.href = "https://ulink.uj.ac.za";
        }, 5500);
    }
</script>
</body>
</html>
