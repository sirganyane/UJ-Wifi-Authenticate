<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Successful - UJ WiFi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid #ff6600; /* UJ Orange */
        }
        .icon { font-size: 50px; color: #4CAF50; }
        h1 { color: #333; margin-top: 10px; }
        p { color: #666; font-size: 18px; }
        .timer-box {
            margin-top: 20px;
            padding: 10px;
            background: #fff5eb;
            border-radius: 8px;
            color: #ff6600;
            font-weight: bold;
        }
        .btn-manual {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #ff6600;
            border: 1px solid #ff6600;
            padding: 8px 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">✔</div>
    <h1>Successfully Connected!</h1>
    <p>You are now authenticated on the <b>WIFI@UJ</b> network.</p>
    
    <div class="timer-box">
        Redirecting to UJ Homepage in <span id="countdown">10</span> seconds...
    </div>

    <a href="https://www.uj.ac.za" class="btn-manual">Go to UJ Homepage Now</a>
</div>

<script>
    let seconds = 10;
    const countdownElement = document.getElementById('countdown');

    const timer = setInterval(() => {
        seconds--;
        countdownElement.textContent = seconds;
        
        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = "https://www.uj.ac.za";
        }
    }, 1000);
</script>

</body>
</html>
