<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; color: #00467F; padding: 50px; }
        .poster { border: 10px solid #00467F; padding: 40px; border-radius: 20px; max-width: 600px; margin: auto; }
        .logo { width: 150px; margin-bottom: 20px; }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .qr-code { width: 300px; height: 300px; margin: 20px 0; border: 5px solid #ee7623; } /* UJ Orange border */
        .instructions { font-size: 1.2em; color: #333; }
        .footer { margin-top: 30px; font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="poster">
        <h1>UJ WIFI ACCESS</h1>
        <p>Madibeng Library - Campus Network</p>
        
        <img src="/images/UJ_WiFi_Login.png" class="qr-code" alt="Scan to Connect">
        
        <div class="instructions">
            <p>1. Scan the QR Code</p>
            <p>2. Login with UJ Student/Staff ID</p>
            <p>3. Enjoy High-Speed Internet</p>
        </div>
        
        <div class="footer">University of Johannesburg | ICT Governance & Support</div>
    </div>
</body>
</html>
