<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | WiFi@UJ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/a/af/University_of_Johannesburg_Logo.svg/1200px-University_of_Johannesburg_Logo.svg.png" 
     alt="UJ Logo" 
     class="logo" 
     style="max-width: 200px; height: auto; margin-bottom: 20px;"> 
        
    <h1>UJ Sign In</h1>
    <p>Enter your UJ credentials to authenticate.</p>
    
    <form action="/auth/login" method="POST" autocomplete="off">
      <label for="username">UJ Username
        <input id="username" name="username" type="text" placeholder="e.g. 219000000" required autofocus />
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" placeholder="••••••••" required />
      </label>
      <button type="submit">Connect to WiFi</button>
    </form>
    
    <hr />
    <a href="landing.html" style="color: #aaa; text-decoration: none; font-size: 0.9rem;">← Back to options</a>
  </main>
</body>
</html>
<div id="error-box" style="display: none; background: #ff4d4d; color: white; padding: 10px; border-radius: 5px; margin-bottom: 1rem; font-size: 0.9rem;">
  ⚠️ Invalid UJ Username or Password. Please try again.
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('error')) {
      document.getElementById('error-box').style.display = 'block';
  }
</script>
