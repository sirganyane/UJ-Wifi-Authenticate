<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Access | WiFi@UJ</title>
    <style>
        :root {
            --uj-blue: #00467F;
            --uj-orange: #FF8C00;
            --uj-dark: #2D2D2D;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 70, 127, 0.8), rgba(0, 70, 127, 0.9)), 
                        url('https://www.uj.ac.za/wp-content/uploads/2021/10/kingsway-campus.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 8px solid var(--uj-orange);
        }
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
        h3 {
            color: var(--uj-blue);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: var(--uj-orange);
        }
        .btn-blue {
            background-color: var(--uj-blue);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn-blue:hover {
            background-color: #00335d;
        }
        .back-link {
            color: #888;
            font-size: 0.85rem;
            text-decoration: none;
            display: block;
            margin-top: 20px;
        }
        .back-link:hover {
            color: var(--uj-orange);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://www.uj.ac.za/wp-content/uploads/2021/11/uj-logo.png" class="logo" alt="UJ Logo">
        
        <h3>Guest Registration</h3>
        <p>Please enter your details for 1-hour high-speed access.</p>
        
        <form action="authorizing.html" method="GET">
            <input type="text" name="guest_name" placeholder="Full Name" required>
            <input type="email" name="guest_email" placeholder="Email Address" required>
            
            <input type="hidden" name="user_type" value="guest">
            
            <button type="submit" class="btn btn-blue">Get Guest Access</button>
        </form>
        
        <a href="poster.html" class="back-link">← Back to Login Selection</a>
    </div>

</body>
</html>
