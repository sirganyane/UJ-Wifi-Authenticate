<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UJ WIFI | Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; border-top: 5px solid #FF8C00; }
        .form-control { background: #2d2d2d; border: 1px solid #444; color: white; }
        .btn-orange { background: #FF8C00; color: white; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="https://www.uj.ac.za/wp-content/uploads/2021/11/uj-logo.png" width="100" class="mb-4">
        <h5 class="text-white mb-4">WIFI ROOT AUTHORITY</h5>
        <form id="adminForm">
            <input type="text" id="adminUser" class="form-control mb-3" placeholder="Administrator ID" required>
            <input type="password" id="adminPass" class="form-control mb-4" placeholder="Security Token" required>
            <button type="submit" class="btn btn-orange">INITIALIZE ACCESS</button>
        </form>
        <div id="errorMsg" class="text-danger mt-3 small" style="display:none;">Invalid Credentials</div>
    </div>

    <script>
        document.getElementById('adminForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            // Simple check (In production, use hashed passwords)
            if (user === "Sir_G" && pass === "UJ@2026") {
                localStorage.setItem('admin_auth', 'true');
                window.location.href = "index.html";
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        };
    </script>
</body>
</html>
