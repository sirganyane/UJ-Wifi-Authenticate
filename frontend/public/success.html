<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Successful | WiFi@UJ</title>
    <style>
        :root {
            --uj-orange: #FF8C00;
            --uj-blue: #00467F;
            --uj-success: #00a859;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        main {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border-top: 8px solid var(--uj-orange);
        }
        .logo { width: 180px; margin-bottom: 1.5rem; }
        h1 { color: var(--uj-success); margin: 0; font-size: 2rem; }
        p { color: #555; margin-bottom: 2rem; }
        
        .metadata-box {
            background: #f9f9f9;
            padding: 1.2rem;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 2rem;
            border: 1px solid #eee;
        }
        .meta-item { margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .meta-item:last-child { border-bottom: none; }
        .label { color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .value { color: #333; font-weight: bold; display: block; font-size: 0.95rem; }

        .btn {
            display: block;
            background: var(--uj-blue);
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        .btn.secondary { background: var(--uj-orange); }
        .btn:hover { opacity: 0.9; }

        .timer-msg {
            font-size: 0.85rem;
            color: #777;
            margin-top: 1.5rem;
        }
        #countdown { color: var(--uj-orange); font-weight: bold; }
    </style>
</head>
<body>

<main>
    <img src="https://www.uj.ac.za/wp-content/uploads/2021/11/uj-logo.png" alt="UJ Logo" class="logo">
    
    <h1>Success!</h1>
    <p>You are now connected to <strong>WiFi@UJ</strong>.</p>
    
    <div class="metadata-box">
        <div class="meta-item">
            <span class="label">Device IP Address</span>
            <span class="value" id="display-ip">Detecting...</span>
        </div>
        <div class="meta-item">
            <span class="label">Operating System</span>
            <span class="value" id="display-os">Detecting...</span>
        </div>
        <div class="meta-item">
            <span class="label">Device Model</span>
            <span class="value" id="display-model">Generic Web Client</span>
        </div>
        <div class="meta-item">
            <span class="label">Session Status</span>
            <span class="value" style="color: var(--uj-success);">Authenticated (8.42 TB Cap)</span>
        </div>
    </div>

    <div class="options">
        <a class="btn" href="https://ulink.uj.ac.za/">Go to uLink</a>
        <a class="btn secondary" href="https://moodle.uj.ac.za/">UJ Moodle</a>
    </div>

    <div class="timer-msg">
        Redirecting to UJ Homepage in <span id="countdown">10</span> seconds...
    </div>
</main>

<script>
    // 1. Load Metadata (IP/OS/Model)
    async function loadMetadata() {
        try {
            // Simulated local detection if API is not available
            document.getElementById('display-os').innerText = navigator.platform;
            
            const response = await fetch('/api/me');
            if (response.ok) {
                const data = await response.json();
                document.getElementById('display-ip').innerText = data.ip || "10.54.12.198";
                document.getElementById('display-model').innerText = data.model || "Mobile Device";
                document.getElementById('display-os').innerText = data.os || navigator.platform;
            }
        } catch (e) {
            console.log("Using local device metadata...");
            document.getElementById('display-ip').innerText = "10.54.12.198";
        }
    }

    // 2. Handle Welcome Email & Redirect
    window.onload = function() {
        loadMetadata();

        // Simulate Publishing the Welcome Email
        console.log("System: Publishing email_welcome.html to user...");
        setTimeout(() => {
            alert("Success! Your welcome email has been published to your student inbox.\nDaily Cap: 8.42 TB applied.");
        }, 500);

        // 10-Second Countdown Redirect
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "https://www.uj.ac.za";
            }
        }, 1000);
    };
</script>

</body>
</html>
