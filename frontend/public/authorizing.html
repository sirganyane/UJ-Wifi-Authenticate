<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UJ WiFi | Authorizing...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f4f4; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        .progress { height: 10px; border-radius: 5px; }
        .progress-bar { background-color: #FF8C00; transition: width 4s linear; }
    </style>
</head>
<body onload="startAuth()">
    <div class="auth-card">
        <div class="spinner-border text-primary mb-3"></div>
        <h4>Authenticating...</h4>
        <p class="text-muted small">Mapping device to Gateway APK-01</p>
        <div class="progress mb-3">
            <div id="p-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <small id="status">Verifying credentials...</small>
    </div>

    <script>
        function startAuth() {
            setTimeout(() => { document.getElementById('p-bar').style.width = "100%"; }, 100);
            setTimeout(() => { document.getElementById('status').innerText = "Registering MAC..."; }, 2000);
            setTimeout(() => { window.location.href = "success.html"; }, 4500);
        }
    </script>
</body>
</html>
