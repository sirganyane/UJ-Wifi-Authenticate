<script>
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const grantUrl = urlParams.get('base_grant_url');
    const continueUrl = urlParams.get('user_continue_url');
    const clientIp = urlParams.get('client_ip') || "10.54.12.198";

    // Store IP in local storage for the success page to read
    localStorage.setItem('user_ip', clientIp);

    const loginForm = document.querySelector('form[action="/auth/login"]');
    if (loginForm) {
      const inputs = [
        { name: 'base_grant_url', value: grantUrl },
        { name: 'user_continue_url', value: continueUrl },
        { name: 'client_ip', value: clientIp }
      ];

      inputs.forEach(data => {
        if (data.value) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = data.name;
          input.value = data.value;
          loginForm.appendChild(input);
        }
      });
    }
  });
</script>

<div class="wifi-settings-card">
    <h3>📶 Manual Configuration for UJ Networks</h3>
    <p>Applicable to: <b>WIFI@UJ, Staff_Access, Guest_WIFI@UJ</b></p>
    <table border="1">
        <tr><td><b>Security</b></td><td>WPA/WPA2/WPA3-Enterprise</td></tr>

        <tr><td><b>Phase 2</b></td><td>MSCHAPV2</td></tr>
        <tr><td><b>CA Certificate</b></td><td>Trust on First Use / Use System</td></tr>
        <tr><td><b>Domain</b></td><td>uj.ac.za</td></tr>
        <tr><td><b>Identity</b></td><td>Your Student Number</td></tr>
        <tr><td><b>Anonymous Identity</b></td><td>Your Student Email</td></tr>
    </table>
    <br>
    <button onclick="window.location.href='/login.html'">Proceed to Login</button>
</div>
