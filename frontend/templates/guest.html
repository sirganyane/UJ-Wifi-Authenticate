<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guest Access | WiFi@UJ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/a/af/University_of_Johannesburg_Logo.svg/1200px-University_of_Johannesburg_Logo.svg.png" 
     alt="UJ Logo" 
     class="logo" 
     style="max-width: 200px; height: auto; margin-bottom: 20px;"> 
    
    <h1>Guest Connectivity</h1>
    <p>By clicking "Connect", you agree to the UJ ICT Fair Use Policy.</p>
    
    <ul style="text-align: left; font-size: 0.85rem; color: #ccc; margin-bottom: 1.5rem;">
      <li>Session Duration: 2 Hours</li>
      <li>Bandwidth: Limited to 10Mbps</li>
      <li>Standard Web Browsing only</li>
    </ul>

    <form action="/auth/guest-confirm" method="POST">
      <button type="submit" style="background-color: #0057b7;">I Agree & Connect</button>
    </form>
    
    <hr />
    <a href="landing.html" style="color: #aaa; text-decoration: none; font-size: 0.9rem;">Back to Login</a>
  </main>
</body>
</html>
