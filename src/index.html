<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJ WiFi | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; display: flex; align-items: center; justify-content: center; height: 100vh; color: white; }
        .login-card { background: #1a1a1a; padding: 2.5rem; border-radius: 15px; border: 1px solid #333; width: 100%; max-width: 400px; }
        .uj-orange { color: #FF8C00; }
        .btn-uj { background: #FF8C00; color: white; border: none; font-weight: bold; }
        .btn-uj:hover { background: #e67e00; color: white; }
        .error-msg { color: #ff4444; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/a/af/University_of_Johannesburg_Logo.svg/1200px-University_of_Johannesburg_Logo.svg.png" height="80" alt="UJ Logo" class="mb-4">
        <h4 class="fw-bold mb-3">WiFi <span class="uj-orange">Portal</span></h4>
        
        <div id="loginError" class="error-msg mb-3">Invalid Credentials. Try again.</div>
        
        <form id="loginForm">
            <input type="text" id="userId" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Student/Staff ID" required>
            <input type="password" id="password" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Password" required>
            <button type="submit" class="btn btn-uj w-100 py-2">LOG IN</button>
        </form>
        
        <div class="mt-4 small text-muted">
            <p><strong>Test Credentials:</strong><br>
            Admin: <code>admin</code> / <code>root</code><br>
            Student: <code>21900123</code> / <code>password</code></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('loginError');

            // MOCK AUTHENTICATION LOGIC
            if (id === 'admin' && pass === 'root') {
                window.location.href = 'admin.html';
            } else if (id === '21900123' && pass === 'password') {
                window.location.href = 'portal.html';
            } else {
                error.style.display = 'block';
            }
        });
    </script>
</body>
</html>
