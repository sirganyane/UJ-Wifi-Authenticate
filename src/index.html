<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJ WiFi Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .uj-orange { color: #FF8C00; }
        .btn-uj { background: #FF8C00; color: white; border: none; }
        .btn-uj:hover { background: #e67e00; color: white; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/a/af/University_of_Johannesburg_Logo.svg/1200px-University_of_Johannesburg_Logo.svg.png" height="80" alt="UJ Logo" class="mb-4">
        <h4 class="fw-bold mb-3">WiFi <span class="uj-orange">Authenticate</span></h4>
        <form action="admin.html">
            <input type="text" class="form-control mb-3" placeholder="Student/Staff ID" required>
            <input type="password" class="form-control mb-3" placeholder="Password" required>
            <button type="submit" class="btn btn-uj w-100 fw-bold">CONNECT TO NETWORK</button>
        </form>
        <p class="mt-3 small text-muted">Authorized access only.</p>
    </div>
</body>
</html>
