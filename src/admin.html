<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJ WiFi Root Authority</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --uj-orange: #FF8C00; --uj-dark: #121212; --uj-grey: #4A4A4A; }
        body.dark-mode { --bg: #0d0d0d; --text: #e0e0e0; --card: #1a1a1a; --border: #333; }
        body.light-mode { --bg: #f4f7f6; --text: #212529; --card: #ffffff; --border: #dee2e6; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; overflow: hidden; }
        .app-container { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 280px; background: var(--uj-dark); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .nav-item { padding: 15px 25px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; border-left: 4px solid transparent; }
        .nav-item.active { background: #1a1a1a; color: white; border-left-color: var(--uj-orange); }
        #main-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .top-bar { background: var(--card); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .module-view { display: none; padding: 30px; animation: slideUp 0.3s ease; }
        .module-view.active { display: block; }
        .uj-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .log-window { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 15px; border-radius: 8px; height: 180px; overflow-y: auto; font-size: 0.8rem; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="light-mode">
<div class="app-container">
    <nav id="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <h3 class="fw-bold m-0">UJ <span style="color:var(--uj-orange)">WIFI</span></h3>
            <small class="text-muted text-uppercase">Root Authority</small>
        </div>
        <div class="mt-3 flex-grow-1">
            <div id="nav-dashboard" class="nav-item active" onclick="nav('dashboard')"><i class="fa fa-th-large"></i> Dashboard</div>
            <div id="nav-nodes" class="nav-item" onclick="nav('nodes')"><i class="fa fa-network-wired"></i> Network Nodes</div>
            <div id="nav-vouchers" class="nav-item" onclick="nav('vouchers')"><i class="fa fa-ticket-alt"></i> Voucher Engine</div>
            <div id="nav-blacklist" class="nav-item" onclick="nav('blacklist')"><i class="fa fa-user-shield"></i> Blacklist Manager</div>
        </div>
        <div class="p-4">
            <button class="btn btn-sm btn-outline-light w-100 mb-2" onclick="toggleMode()">🌓 Switch Theme</button>
        </div>
    </nav>
    <main id="main-content">
        <header class="top-bar">
            <h5 class="fw-bold m-0" id="m-title">DASHBOARD</h5>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-dark px-3 py-2">SYS_IP: 10.0.0.1</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/a/af/University_of_Johannesburg_Logo.svg/1200px-University_of_Johannesburg_Logo.svg.png" height="45" alt="UJ Logo">
            </div>
        </header>

        <div id="dashboard" class="module-view active">
            <div class="row">
                <div class="col-md-8">
                    <div class="uj-card">
                        <h6 class="fw-bold text-muted mb-4">CAMPUS USAGE (REAL-TIME)</h6>
                        <canvas id="usageChart" height="280"></canvas>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="uj-card bg-dark text-white">
                        <small class="opacity-75">DATA TODAY</small>
                        <h2 class="fw-bold mt-1">8.42 TB</h2>
                        <button class="btn btn-warning w-100 mt-3" onclick="alert('Priority Mode: ENGAGED')">ACTIVATE PRIORITY</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="nodes" class="module-view">
             <div class="uj-card">
                <h6 class="fw-bold text-danger mb-3"><i class="fa fa-exclamation-triangle me-2"></i> SYSTEM LOG</h6>
                <div class="log-window" id="node-log"></div>
            </div>
        </div>

        <div id="vouchers" class="module-view">
            <div class="row">
                <div class="col-md-6">
                    <div class="uj-card">
                        <h6>Voucher Generator</h6>
                        <button class="btn btn-warning w-100 fw-bold" onclick="genVoucher()">GENERATE QR</button>
                        <div id="qr-box" class="mt-3 text-center"></div>
                        <h4 class="text-center mt-2" id="vCode"></h4>
                    </div>
                </div>
            </div>
        </div>

        <div id="blacklist" class="module-view">
            <div class="uj-card">
                <h6 class="text-danger fw-bold">FIREWALL CONTROL</h6>
                <div class="input-group mb-3">
                    <input type="text" id="banId" class="form-control" placeholder="Student ID">
                    <button class="btn btn-danger" onclick="addBan()">COMMIT BAN</button>
                </div>
                <table class="table"><tbody id="ban-list"></tbody></table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    function nav(id) {
        document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        document.getElementById('m-title').innerText = id.toUpperCase();
    }

    function toggleMode() { document.body.classList.toggle('dark-mode'); document.body.classList.toggle('light-mode'); }

    const ctx = document.getElementById('usageChart').getContext('2d');
    const usageChart = new Chart(ctx, {
        type: 'line',
        data: { labels: Array(15).fill(''), datasets: [{ data: Array(15).fill(0), borderColor: '#FF8C00', tension: 0.4, fill: true, backgroundColor: 'rgba(255,140,0,0.1)' }] },
        options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
    });

    setInterval(() => {
        usageChart.data.datasets[0].data.shift();
        usageChart.data.datasets[0].data.push(Math.random() * 100);
        usageChart.update('none');
        
        if (Math.random() > 0.8) {
            const log = document.getElementById('node-log');
            log.innerHTML += `[${new Date().toLocaleTimeString()}] Traffic spike detected at APK...<br>`;
            log.scrollTop = log.scrollHeight;
        }
    }, 1500);

    function genVoucher() {
        const code = "UJ-" + Math.floor(10000 + Math.random() * 90000);
        document.getElementById('vCode').innerText = code;
        document.getElementById('qr-box').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${code}" />`;
    }

    function addBan() {
        const id = document.getElementById('banId').value;
        if(id) {
            document.getElementById('ban-list').innerHTML += `<tr><td>${id}</td><td>Abuse</td><td><button class="btn btn-sm text-danger" onclick="this.parentElement.parentElement.remove()">Revoke</button></td></tr>`;
        }
    }
</script>
</body>
</html>
